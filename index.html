<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectoEssentialsHub - Your Electronics Store</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container">
      <div class="logo">
        <img src="images/logo.png" alt="ElectoEssentialsHub Logo">
      </div>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Shop</a></li>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <div class="cart">
        <a href="#"><i class="fas fa-shopping-cart"></i> Cart</a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>Welcome to ElectoEssentialsHub</h1>
      <p>Your one-stop shop for all electronic essentials.</p>
      <a href="#" class="btn">Shop Now</a>
    </div>
  </section>

  <!-- Product Categories -->
  <section class="categories">
    <div class="container">
      <h2>Explore Our Categories</h2>
      <div class="category-grid">
        <div class="category-item">
          <img src="images/smartphones.jpg" alt="Smartphones">
          <h3>Smartphones</h3>
        </div>
        <div class="category-item">
          <img src="images/laptops.jpg" alt="Laptops">
          <h3>Laptops</h3>
        </div>
        <div class="category-item">
          <img src="images/accessories.jpg" alt="Accessories">
          <h3>Accessories</h3>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-links">
        <ul>
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Terms of Service</a></li>
          <li><a href="#">FAQ</a></li>
        </ul>
      </div>
      <div class="social-media">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
      </div>
      <p>&copy; 2023 ElectoEssentialsHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="scripts/script.js"></script>
</body>
</html>
